name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private document content, passwords, and personal paths before submitting.
  - type: input
    id: version
    attributes:
      label: PdfMerger version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: Paste sanitized Details output or terminal logs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed passwords, private PDFs, personal paths, and other sensitive data.
          required: true
