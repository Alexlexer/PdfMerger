[package]
name = "pdf-merger"
version = "0.3.0"
edition = "2024"
description = "A native desktop PDF merger and image-to-PDF arranger"
license = "MIT"
repository = "https://github.com/Alexlexer/PdfMerger"
homepage = "https://github.com/Alexlexer/PdfMerger"
readme = "README.md"
keywords = ["pdf", "merge", "desktop", "egui", "offline"]
categories = ["gui", "multimedia::images"]

[dependencies]
anyhow = "1.0"
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
hayro = "0.7.1"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
indexmap = "2.13"
lopdf = "0.44"
printpdf = { version = "0.12", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zeroize = "1.9.0"

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
